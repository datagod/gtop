name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_linux_gpu:
    runs-on: ubuntu-24.04
    container: alpine:edge
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: apk add --no-cache --update gcc g++ make linux-headers lowdown

      - name: Compile gtop with GPU support
        run: make CXX=g++ GPU_SUPPORT=true QUIET=true

      - name: Package binary
        run: |
          mkdir -p dist
          cp bin/gtop dist/gtop-linux-x86_64
          chmod +x dist/gtop-linux-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gtop-linux-x86_64
          generate_release_notes: true